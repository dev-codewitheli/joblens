plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.codewitheli'
version = '0.1.0'
description = 'JobLens — an AI job-application assistant'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    springAiVersion = '1.0.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // API docs (Swagger UI at /swagger-ui.html)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // Spring AI — provider-agnostic ChatClient. OpenAI-compatible starter works
    // with OpenAI, Groq, or a local Ollama endpoint by changing base-url/model.
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // Job-posting import: PDF text extraction + HTML parsing for URL import
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation 'org.jsoup:jsoup:1.18.1'

    // Persistence (active only under the 'postgres' profile; see application-postgres.yml)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
